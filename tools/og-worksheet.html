<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;600&display=swap">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;background:#3A1F3D;color:#fff;font-family:Inter,sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:64px 80px;box-sizing:border-box}
  .brand{display:flex;align-items:center;gap:16px}
  .brand .m{width:60px;height:60px;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
  .brand .w{height:30px;width:auto}
  .badge{display:inline-block;background:#5A3360;color:#7FD8BE;border-radius:999px;padding:8px 18px;font-weight:600;font-size:20px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:24px}
  h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:60px;line-height:1.1;letter-spacing:-0.02em;margin:0;max-width:1020px}
  h1 span{color:#7FD8BE}
  .foot{display:flex;justify-content:space-between;align-items:center;font-size:24px;color:rgba(255,255,255,.8);border-top:1px solid rgba(255,255,255,.18);padding-top:24px}
  .foot b{font-family:'Plus Jakarta Sans',sans-serif;color:#7FD8BE;font-size:30px}
</style></head>
<body>
  <div class="brand"><img class="m" src="../assets/brand/logo-mark.png" alt=""><img class="w" src="../assets/brand/wordmark-white.png" alt="marakit"></div>
  <div><span class="badge">AI Marketing Worksheet untuk UMKM</span><h1>Isi profil bisnismu sekali. <span>31 prompt marketing</span> langsung siap dipakai.</h1></div>
  <div class="foot"><span>Google Sheets · ChatGPT, Claude, atau Gemini</span><b>Rp59.000</b></div>
</body></html>
