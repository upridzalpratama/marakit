<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;600&display=swap">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;background:#3A1F3D;color:#fff;font-family:Inter,sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:72px 80px;box-sizing:border-box}
  .grid{display:none}
  .brand{display:flex;align-items:center;gap:18px}.brand .m{width:72px;height:72px;border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}.brand span{display:flex;flex-direction:column;gap:6px}.brand .w{height:34px;width:auto}
  .brand i{display:none}
  .brand small{display:block;font-family:Inter,sans-serif;font-size:18px;color:rgba(255,255,255,.75);font-weight:400}
  h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:64px;line-height:1.1;margin:0;max-width:1000px;letter-spacing:-0.02em}
  h1 span{color:#7FD8BE}
  .foot{display:flex;justify-content:space-between;align-items:center;font-size:22px;color:rgba(255,255,255,.75);border-top:1px solid rgba(255,255,255,.18);padding-top:24px}
  .foot b{color:#7FD8BE;font-weight:600}
  .bar{display:none}
</style></head>
<body>
  <div class="grid"></div>
  <div class="brand"><img class="m" src="../assets/brand/logo-mark.png" alt=""><span><img class="w" src="../assets/brand/wordmark-white.png" alt="marakit"><small>marketing system builder</small></span></div>
  <div><div class="bar"></div><h1>A marketing system <span>you own</span>, not a service you rent forever.</h1></div>
  <div class="foot"><span>Systems you build, not rent.</span><b>marakit.com/en</b></div>
</body></html>
