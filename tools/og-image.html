<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;background:#05070D;color:#EEF2FF;font-family:'Instrument Sans',sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:72px 80px;box-sizing:border-box;position:relative;overflow:hidden}
  body::before{content:"";position:absolute;width:760px;height:760px;left:-260px;top:-360px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,26,.55),rgba(255,122,26,.15) 35%,transparent 68%)}
  body::after{content:"";position:absolute;width:700px;height:700px;right:-300px;bottom:-320px;border-radius:50%;background:radial-gradient(circle,rgba(20,200,224,.5),rgba(20,200,224,.12) 35%,transparent 68%)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:60px 60px}
  .brand,div,h1{position:relative;z-index:1}
  .brand{font-family:Syne,sans-serif;font-size:38px;font-weight:700}
  .brand i{font-style:normal;color:#FFB547}
  .brand small{display:block;font-family:'JetBrains Mono',monospace;font-size:16px;color:#8C97B2;font-weight:500;margin-top:6px;letter-spacing:.1em;text-transform:uppercase}
  h1{font-family:Syne,sans-serif;font-weight:700;font-size:62px;line-height:1.05;margin:0;max-width:1000px;letter-spacing:-0.035em}
  h1 span{background:linear-gradient(100deg,#FFB547,#FF6B2C 45%,#3EF0FF);-webkit-background-clip:text;background-clip:text;color:transparent}
  .foot{display:flex;justify-content:space-between;align-items:center;font-size:22px;color:#8C97B2;border-top:1px solid rgba(255,255,255,.12);padding-top:24px}
  .foot b{color:#EEF2FF;font-family:'JetBrains Mono',monospace;font-weight:500}
  .bar{display:none}
</style></head>
<body>
  <div class="grid"></div>
  <div class="brand">Marakit<i>.</i><small>perakit sistem marketing</small></div>
  <div><div class="bar"></div><h1>Sistem marketing yang <span>kamu miliki sendiri</span>, bukan jasa yang kamu sewa selamanya.</h1></div>
  <div class="foot"><span>Sistemnya dirakit, bukan disewa.</span><b>marakit.com</b></div>
</body></html>
